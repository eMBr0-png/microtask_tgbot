[project]
name = "microtask-tgbot"
version = "0.1.0"
description = ""
authors = [
    {name = "Jaroslav Slipchuk",email = "s2010yd@icloud.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram (>=3.31.0,<4.0.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "sqlalchemy (>=2.1.6,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "greenlet (>=3.5.6,<4.0.0)"
]

[tool.poetry]
packages = [{include = "microtask_tgbot", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
